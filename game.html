<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人生模擬器</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e5e7eb;--acc:#0f766e;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:700;font-size:18px}.sub{font-size:13px;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:8px 14px 10px;background:var(--card)}
.st{font-size:12px}.st .lb{display:flex;justify-content:space-between}
.bar{height:8px;background:#eceff3;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:4px}
#feed{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.yr{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.yr h4{margin:0 0 4px;font-size:14px;color:var(--acc)}
.ln{font-size:15px;line-height:1.5;margin:4px 0;padding-left:8px;border-left:3px solid transparent}
.ln.good{border-color:var(--good)}.ln.bad{border-color:var(--bad)}
.bottom{display:flex;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.tab{flex:1;border:0;background:none;font-size:12px;padding:8px 0;min-height:58px;color:var(--ink)}
.tab b{display:block;font-size:20px;font-weight:400}
#ageBtn{flex:0 0 auto;width:80px;height:80px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:700;margin:-26px 6px 0;box-shadow:0 4px 12px rgba(0,0,0,.28)}
#ageBtn:disabled{opacity:.5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.on{display:flex}.ov.mid{align-items:center}
.pane{background:var(--card);width:100%;max-width:520px;max-height:84dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
.pane.mid{border-radius:16px;margin:14px;width:auto;max-width:480px}
.pane h3{margin:0 0 6px;font-size:18px}
.pane p{margin:6px 0;line-height:1.55;font-size:15px}
.btn{display:block;width:100%;padding:15px 14px;min-height:54px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;margin:9px 0;text-align:left;color:var(--ink)}
.btn.p{background:var(--acc);color:#fff;border:0;text-align:center;font-weight:700}
.btn:disabled{opacity:.45}
.btn small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.btn.p small{color:#d1fae5}
.mini{border:1px solid var(--acc);color:var(--acc);background:#fff;border-radius:10px;padding:11px 14px;min-height:44px;font-size:14px;margin-left:6px}
.sh{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;gap:8px;margin:-14px -14px 8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sh b{flex:1;font-size:17px}
.sh button{border:0;background:#f1f5f9;border-radius:50%;width:44px;height:44px;font-size:20px;color:var(--ink)}
.sh+h3{display:none}
.sh~.sec:first-of-type{margin-top:6px}
.sh+*{margin-top:12px}
.sh .bk{visibility:hidden}.sh .bk.on{visibility:visible}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.tile{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px 8px;font-size:15px;text-align:center;min-height:98px;color:var(--ink)}
.tile b{display:block;font-size:30px;font-weight:400;margin-bottom:6px}
.tile small{display:block;color:var(--mute);font-size:11px;margin-top:3px}
.sec{font-size:13px;color:var(--mute);margin:14px 0 4px;font-weight:700}
.msg{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:9px 11px;margin:6px 0 8px;font-size:14px;line-height:1.5}
.msg.bad{background:#fef2f2;border-color:#fecaca}
.item{padding:8px 0;border-bottom:1px solid var(--line)}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);font-size:16px;margin:6px 0}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:13px 6px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.neg{color:var(--bad)}
.seg button:disabled{opacity:.4}
table.rt{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 10px}
table.rt td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.rt td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.rt tr.b td{font-weight:700;background:#f8fafc}
table.rt tr.h td{font-weight:700;color:var(--acc);background:#ecfdf5;text-align:left}
#modal .pane{max-height:88dvh}
.bub{background:#fdf2f8;border-left:4px solid #ec4899;padding:10px 12px;border-radius:12px;margin:10px 0;line-height:1.7;font-size:15px}.bub.good{background:#ecfdf5;border-color:#10b981}.bub.bad{background:#fef2f2;border-color:#ef4444}
html.dark{--bg:#0f141b;--card:#1a212b;--ink:#e6e9ef;--mute:#98a2b3;--line:#2b3441;--acc:#2dd4bf;--good:#4ade80;--bad:#f87171}
html.dark .btn,html.dark .tile,html.dark .mini,html.dark .seg button{background:var(--card);color:var(--ink)}
html.dark .mini{color:var(--acc)}html.dark .btn.p,html.dark .seg button.on,html.dark #ageBtn{color:#06231f}
html.dark .seg button.on{background:var(--acc);color:#06231f;border-color:var(--acc)}html.dark .btn.p{background:var(--acc);color:#06231f}
html.dark .sh button{background:#2b3441}html.dark .bar{background:#2b3441}
html.dark .msg{background:#12301f;border-color:#1e5a37}html.dark .msg.bad{background:#3a1717;border-color:#7a2a2a}
html.dark .bub{background:#2a1a28}html.dark .bub.good{background:#12301f}html.dark .bub.bad{background:#3a1717}
html.dark table.rt tr.b td{background:#222a35}html.dark table.rt tr.h td{background:#12301f}
html.dark input,html.dark textarea{background:var(--card);color:var(--ink);border-color:var(--line)}
</style>
<style id="v2">

function randEvents(){
 const pool=E.filter(e=>S.age>=e.min&&S.age<=e.max&&(!e.if||e.if())&&!(S.seen[e.id]>=S.age-3));
 const out=[],n=chance(.85)?(chance(.3)?2:1):0;
 for(let i=0;i<n&&pool.length;i++){
  let r=Math.random()*pool.reduce((s,e)=>s+e.w,0),k=0;
  for(;k<pool.length-1;k++){r-=pool[k].w;if(r<=0)break}
  const e=pool.splice(k,1)[0];S.seen[e.id]=S.age;out.push(e);
 }
 return out;
}

function ipoCheck(co,step){
 const L=co.L,h=co.hist,cap=-L.capital,last=h[h.length-1],prev=h[h.length-2];
 const ratio=r=>r?r.PBTc/Math.max(1,-r.close.capital):-1;
 const noDef=L.re<=0;
 const c=[];const add=(ok,t)=>c.push({ok,t});
 if(step==='pub'){add(co.form==='股份有限公司','組織型態為股份有限公司（現為 '+co.form+'）');add(S.money>=0||L.cash>=3e6,'公司現金足以支付輔導費 NT$3,000,000');add(co.stage===0,'尚未公開發行');}
 if(step==='emg'){add(co.stage===1,'已公開發行');add(co.stageYrs>=1,'公開發行輔導滿 1 年（遊戲簡化）');add(L.cash>=2e6,'現金足以支付興櫃登錄費用 NT$2,000,000');}
 if(step==='otc'){
  add(co.stage===2,'目前為興櫃（掛牌滿 1 年再申請，遊戲簡化）');add(co.stageYrs>=2,'公開發行滿 2 年');
  add(cap>=5e7,'實收資本額 5,000 萬元以上（現為 '+money(cap)+'）');add(co.yrs>=2,'設立登記滿 2 個完整會計年度');
  const a=ratio(last),b=ratio(prev);
  add(a>=.04||(b>=.03&&a>=.03)||((a+b)/2>=.03&&a>b&&b>-1),'稅前淨利占股本：最近一年 ≥4%，或最近兩年均 ≥3%（現為 '+(a*100).toFixed(1)+'%）');
  add(last&&last.PBTc>=4e6,'最近一年稅前淨利 ≥ 400 萬元');add(noDef,'決算無累積虧損');}
 if(step==='lst'){
  add(co.stage>=2&&co.stage<4,'已為興櫃或上櫃');add(co.stageYrs>=2,'公開發行滿 2 年');
  add(cap>=6e8,'實收資本額 6 億元以上（現為 '+money(cap)+'）');add(co.yrs>=3,'設立登記滿 3 年');
  const a=ratio(last),b=ratio(prev);let f5=h.length>=5&&h.slice(-5).every(r=>ratio(r)>=.03);
  add((a>=.06&&b>=.06)||((a+b)/2>=.06&&a>b)||f5,'稅前淨利占股本：近兩年均 ≥6%（或兩年平均 ≥6% 且較佳，或近五年均 ≥3%）；現為 '+(a*100).toFixed(1)+'%');
  add(noDef,'最近年度決算無累積虧損');}
 return c;
}

  return prog(Math.max(0,gross-debts-ded),TWE)};

 if(code==='TW'){const all=gs.filter(g=>g.age===yr).reduce((s,g)=>s+g.amt,0);tx=prog(Math.max(0,all+amt-2440000),TWG)-prog(Math.max(0,all-2440000),TWG)}

  const yrK=gs.filter(g=>g.to===kidId&&g.age===yr).reduce((s,g)=>s+g.amt,0)/fx,ex=Math.max(0,19000-yrK),tg=Math.max(0,amt/fx-ex);ta=tg*fx;

 for(const q in S.fxh)A.fx+=S.fxh[q]*S.fx[q];
 const debts=Math.max(0,-S.money)+(S.mort?S.mort.left:0);
 let add=0,credit=0;
 for(const g of (S.gifts||[]))if(E.lb&&S.age-g.age<=E.lb){add+=g.ta;credit+=g.tx}
 const gross0=A.cash+A.house+A.car+A.fx+A.inv+A.pf+A.co+A.live,gross=gross0+add;
 const sp=S.partner&&S.partner.married?S.partner:null,kids=S.kids.map(kidFix),nK=kids.length;
 const law=E.sp(nK),lawSh={},sh={};
 if(sp&&nK){lawSh.sp=law;kids.forEach(x=>lawSh[x.id]=(1-law)/nK)}else if(sp)lawSh.sp=1;else kids.forEach(x=>lawSh[x.id]=1/nK);
 Object.assign(sh,lawSh);
 const w=S.will;let wtxt='未立遺囑，依法定繼承';
 if(w&&(nK||sp)){

  if(w.mode==='spouse'&&sp){sh.sp=1;kids.forEach(x=>sh[x.id]=0);wtxt='遺囑：全部留給配偶'}
  else if(w.mode==='succ'&&kids.find(x=>x.id===w.succ)){const s=w.sh/100;kids.forEach(x=>sh[x.id]=kp*(x.id===w.succ?(nK>1?s:1):(nK>1?(1-s)/(nK-1):0)));wtxt=`遺囑：指定接班人分得子女份額的 ${w.sh}%`}
  else if(w.mode==='ability'&&nK){const ws=kids.map(x=>(x.sm+x.gr+x.ts)/3),sm=ws.reduce((a,b)=>a+b,0);kids.forEach((x,i)=>sh[x.id]=kp*ws[i]/sm);wtxt='遺囑：依能力加權分配'}

 }
 let claim='';
 if(E.fp&&nK>1&&w){for(const x of kids){if(sh[x.id]<.1*lawSh[x.id]&&!dry&&chance(E.fp)){const t=.25*lawSh[x.id],o=Object.keys(sh).filter(h=>h!==String(x.id)&&sh[h]>0);const tot=o.reduce((s,h)=>s+sh[h],0);if(tot>0){o.forEach(h=>sh[h]-=sh[h]/tot*t);sh[x.id]+=t;claim=`${x.n}向法院請求扶養／分配，取得一部分遺產。`}}}}
 const funeral=Math.round(1380000*wTW(k)/761000),pbase=Math.max(0,gross0-A.live),probate=Math.round(E.pb*pbase);
 const NE=Math.max(0,gross0-debts),shAmt=h=>(sh[h]||0)*NE;
 const ctx={gross,debts,spAmt:shAmt('sp'),hasSp:!!sp,kids:kids.map(x=>({age:x.age,amt:shAmt(x.id)})),par:(S.mom.alive?1:0)+(S.dad.alive?1:0),house:A.house>0,widow:!!S.flags.widow,twS:k==='TW'?0:A.house+A.co};

}

 if(x==='go'){view.scene=null;view.rmsg=null;view.rsub=y==='p'&&S.partner?'Rp':'R';return null}
 if(x==='c'){view.scene=null;view.rmsg=null;view.rsub='Rc'+y;return null}
 if(x==='cancel'){view.scene=null;return null}
 if(x==='meet'){view.rsub='R';return meetNew()}
 if(x==='drop'){S.crush.splice(+y,1);view.rsub='R';view.scene=null;return N('你決定放下這段心意。')}
 if(x==='act'){const isP=y==='p',t=isP?S.partner:S.crush[+y];if(!t)return B('對象已不在了。');view.rsub=isP?'Rp':'Rc'+y;view.rmsg=null;view.scene=null;
  if(isP&&z==='break'){view.rsub='R';return interact('partner','breakup')}
    return actStart(t,isP,z)}
 if(x==='adopt'){view.rsub='R';return adopt(S.partner)}
 if(x==='pick'){const sc=view.scene;if(!sc)return null;const t=tgtOf(sc.k);if(!t){view.scene=null;return null}const o=sc.opts[+y];
  if(o.c&&S.money<o.c)return B('你的錢不夠。');if(S.ap<1){view.scene=null;return B('行動點不足。')}
  S.ap--;S.money-=o.c||0;sceneApply(t,sc.k==='p',sc.type,o);view.scene=null;return null}
 if(x==='cf'){const c=S.crush[+y];if(!c)return null;const r=confess(c);const i=S.crush.indexOf(c);view.rsub=i>=0?'Rc'+i:(S.partner?'Rp':'R');view.scene=null;return r}
 return null
}

function romBubble(){const m=view.rmsg;view.rmsg=null;return m?`<div class="bub ${m.q==='b'?'bad':m.q==='g'?'good':''}">${esc(m.t).replace(/\n/g,'<br>')}</div>`:''}
function sceneHTML(t,k){
 const sc=view.scene;if(!sc||sc.k!==k)return '';
 return `<div class="bub">${esc(sc.text)}</div>`+sc.opts.map((o,i)=>`<button class="btn" data-a="rom:pick:${i}">${esc(o.l)}${o.s?`<small>${esc(o.s)}</small>`:''}</button>`).join('')+`<button class="btn" data-a="rom:cancel">取消</button>`;
}
function romHTML(k){
 mFix();
 if(k==='Rp'&&S.partner)return partnerPage();
 if(k&&k.startsWith('Rc')){const i=+k.slice(2);if(S.crush[i])return crushPage(i)}
 return romHome();
}

function lifeSVG(){
 const hs=S.hs||[];if(hs.length<3)return '';
 const W=320,H=90,P=4,mx=Math.max(100,...hs.map(x=>x.w)),mn=Math.min(0,...hs.map(x=>x.w)),n=hs.length;
 const X=i=>P+i*(W-2*P)/(n-1),Yw=v=>H-P-(v-mn)/(mx-mn||1)*(H-2*P),Yp=v=>H-P-v/100*(H-2*P);
 const pl=(f,k)=>hs.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${f(x[k]).toFixed(1)}`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="background:var(--card,#fff);border:1px solid var(--line,#ddd);border-radius:10px"><path d="${pl(Yw,'w')}" fill="none" stroke="#2f6f5f" stroke-width="2"/><path d="${pl(Yp,'h')}" fill="none" stroke="#d98324" stroke-width="1.5"/><path d="${pl(Yp,'hp')}" fill="none" stroke="#b5483c" stroke-width="1.5" stroke-dasharray="3 2"/></svg><div class="sub">綠＝淨資產　橘＝快樂　紅虛線＝健康（${hs[0].a}～${hs[n-1].a} 歲）</div>`;
}
function lifeText(){
 const keys=/結婚|出生|創業|畢業|確診|過世|移民|退休|離婚|成就解鎖|分手|入獄|服役|替代役|癌|中風/;
 const hl=[];for(const L of S.log)for(const x of L.lines){const t=typeof x==='string'?x:(x.t||x[0]||'');if(keys.test(t)&&!/^🏆/.test(t))hl.push(`${L.age} 歲：${t.replace(/<[^>]+>/g,'')}`)}
 const m=hl.length>10?hl.filter((_,i)=>i%Math.ceil(hl.length/10)===0).slice(0,10):hl;
 return stripEmoji(`【人生模擬器】${S.name}，享年 ${S.age} 歲，死因：${S.cause}\n結局：${endTitle()}　學歷：${EDU[S.edu]}　淨資產：${money(netWorth())}　子女：${S.kids.length} 人　第 ${S.gen||1} 代\n`+m.join('\n'));

const EMO_RE=/(\p{Regional_Indicator}{2}|(?:(?![©®™])\p{Extended_Pictographic}|☰)(?:️|\u{1F3FB}-\u{1F3FF})?(?:‍\p{Extended_Pictographic}️?)*)/gu;
function icoKey(e){const k=e.replace(/️/g,'');return EMO[k]||EMO[k.replace(/‍.*$/,'')]||null}
function mkIcon(id){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','ic ic-'+id);s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');s.innerHTML=IC[id]||IC.dot;return s}
function stripEmoji(t){return String(t).replace(EMO_RE,'').replace(/\s{2,}/g,' ').trim()}
function iconize(root){
 if(!root||!root.nodeType)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),list=[];let n;
 while((n=w.nextNode())){const p=n.parentNode&&n.parentNode.nodeName;if(p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA'||p==='TITLE')continue;if(EMO_RE.test(n.nodeValue)){list.push(n)}EMO_RE.lastIndex=0}
 for(const t of list){
  const parts=t.nodeValue.split(EMO_RE),fr=document.createDocumentFragment();
  parts.forEach((s,i)=>{
   if(i%2===0){if(s)fr.appendChild(document.createTextNode(s));return}
   if(/^\p{Regional_Indicator}/u.test(s)){const sp=document.createElement('span');sp.className='flag';sp.textContent=[...s].map(c=>String.fromCharCode(c.codePointAt(0)-0x1F1E6+65)).join('');fr.appendChild(sp);return}
   const k=icoKey(s);if(k)fr.appendChild(mkIcon(k));
  });
  t.parentNode.replaceChild(fr,t);
 }
}
(function(){
 if(typeof document==='undefined'||!document.body||!document.body.appendChild||typeof MutationObserver==='undefined')return;
 let pend=false;const q=new Set();
 const run=()=>{pend=false;const a=[...q];q.clear();a.forEach(iconize)};
 const mo=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData'){q.add(m.target.parentNode)}else m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)q.add(n.nodeType===3?n.parentNode:n)})}if(!pend){pend=true;Promise.resolve().then(run)}});
 mo.observe(document.body,{childList:true,subtree:true,characterData:true});
 iconize(document.body);
})();

function decorate(e,c){

}

function fxApply(k,spec){
 let m=0;
 (spec||'').split(' ').forEach(t=>{
  const r=t.match(/^([a-z]+)([+-]\d+(?:\.\d+)?)$/);if(!r)return;const v=+r[2];
  switch(r[1]){
   case 'h':chg('happy',v);break;case 'hl':chg('health',v);break;case 'st':S.stress=cl(S.stress+v);break;case 'sm':chg('smarts',v);break;
   case 'ln':S.lang[k]=cl((S.lang[k]!=null?S.lang[k]:langInit(k))+v);break;
   case 'nt':S.net=cl((S.net||0)+v);break;
   case 'm':m+=v;S.money+=Math.round(v*fxr(k));break;
   case 'sp':{const x=Math.round(sal()*v/100);S.money+=x;m+=x/fxr(k)}break;
   case 'pf':if(S.job&&!S.job.founder)S.job.perf=cl(S.job.perf+v);break;
   case 'fam':[S.mom,S.dad].forEach(p=>{if(p&&p.alive)p.rel=cl(p.rel+v)});break;
   case 'quit':if(S.job&&!S.job.founder){S.job=null}break;
   case 'fin':case 'comm':case 'lead':case 'tech':case 'cre':case 'fit':bump('s',r[1],v);break;
   case 'ext':case 'agr':case 'con':case 'opn':case 'sta':bump('p',r[1],v);break;
  }});
 return m;
}

}

const polN=()=>((S.cn||'TW')==='TW'?'165 反詐騙專線':'當地警方');

function scLose(frac,cap,minv){const m=Math.max(S.money,0);let a=Math.round(Math.min(m*frac,cap));if(a<(minv||0))a=Math.min(m,minv||0);S.money-=a;S.flags.scam=(S.flags.scam||0)+1;S.flags.scamAw=(S.flags.scamAw||0)+1;S.stress=cl(S.stress+10);chg('happy',-8);return a}
function scAfter(a){
 if(a<=0)return;
 queue.unshift({run:()=>({t:`你發現被騙了，損失 ${money(a)}。要怎麼做？`,c:[
  ch(`立刻撥打 ${polN()} 並報案`,()=>{if(chance(.18)){const b=Math.round(a*R(25,60)/100);S.money+=b;return G(`警方協助攔阻部分款項，追回 ${money(b)}。`)}return N('你完成報案，但款項多半已經被轉走；警方提醒你保留所有對話與轉帳紀錄。')}),
  ch('覺得丟臉，不敢跟別人說',()=>{S.stress=cl(S.stress+6);return B('你獨自煩惱了很久。記得：被騙不是你的錯，越早通報越有機會止損。')}),
  ch('告訴家人朋友，提醒大家小心',()=>{chg('happy',2);return N('你把經驗分享出去，身邊的人都提高了警覺。')})]})});
}
function scEv(id,min,max,w,iff,text,opts){
 E.push({id:'scam_'+id,min,max,w,if:()=>(!iff||iff()),run:()=>({t:typeof text==='function'?text():text,c:opts.map(o=>ch(o[0],()=>o[1]()))})});
}

const RNREF={5:390,10:380,21:395,42:420};
function rnRun(n,km){
 tlInit();mFix();
 const f=S.skl.fit*.5+S.runlv*.5;let pace=540-3.3*f;
 const a=S.age;pace*=a<20?1+(20-a)*.015:a>35?1+(a-35)*.006+(a>60?(a-60)*.01:0):1;
 if(S.health<60)pace*=1+(60-S.health)*.002;
 pace*={5:1,10:1.04,21:1.10,42:1.22}[Math.round(km)];
 if(km>40&&S.runlv<30)pace*=1.12;
 pace*=Math.exp(.05*nrm());
 if(km>40&&S.runlv<20&&chance(.3)){chg('health',-R(5,12));chg('happy',-4);const m=`${n}跑到一半抽筋倒下，沒有完賽（準備不足）。`;S.cpr.push({y:calYear(),a:S.age,n:'路跑 '+n,r:'未完賽',p:0});return B(m)}
 const t=pace*km,key=Math.round(km),pb=S.rpb[key],pct=Math.max(.1,100*(1-cpPhi((Math.log(RNREF[key])-Math.log(pace))/.22)));
 let m=`你完成 ${n}，成績 ${cpFmt(t)}（配速每公里 ${cpFmt(pace)}），約全場前 ${pct.toFixed(pct<10?1:0)}%。`;
 let tone='good',prize=0;
 if(pb==null||t<pb){if(pb!=null)m+=`破了個人最佳（原 ${cpFmt(pb)}）！`;S.rpb[key]=t}
 if(pct<=2){prize=km>40?R(10000,30000):R(2000,8000);S.money+=prize;m+=`拿到組別名次，獎金 ${money(prize)}。`;S.cfame=Math.min(100,S.cfame+2)}
 chg('health',km>40?-R(0,3):R(0,2));chg('happy',km>40?R(6,12):R(2,6));mFix();S.skl.fit=Math.min(100,S.skl.fit+(km>20?2:1));
 S.cpr.push({y:calYear(),a:S.age,n:'路跑 '+n,r:cpFmt(t)+'・前'+pct.toFixed(0)+'%',p:prize});
 return [m,tone];
}

function cpRun(d){
 tlInit();
 const need=Math.max(0,Math.min(100,d.need()));
 const base=[.75,.5,.38,.3];
 let k=0,out=null;
 for(;k<d.st.length;k++){
  const last=k===d.st.length-1;
  if(!last){
   const p=Math.max(.04,Math.min(.95,(base[Math.min(k,3)]||.35)+(need-50)/90));
   if(!chance(p)){out=`止步${d.st[k]}`;break}
   log(`你通過了「${d.n}」的${d.st[k]}。`,'good');
  }
 }
 let place=null;
 if(!out){
  const p1=Math.max(.02,Math.min(.6,.14+(need-55)/150));
  place=chance(p1)?0:chance(.3)?1:chance(.35)?2:3;
  out=['冠軍','亞軍','季軍','入圍決賽（未得名次）'][place];
 }
 let prize=place!=null&&place<3?d.pz[place]:0;
 S.money+=prize;
 const fameD=place===0?(d.cost>=800||d.pz[0]>=50000?8:3):place!=null&&place<3?(d.pz[0]>=50000?4:1):place===3?1:0;
 S.cfame=Math.min(100,S.cfame+fameD);
 chg('happy',place===0?12:place!=null&&place<3?8:place===3?3:-2);
 if(place===0)S.karma=cl(S.karma+1);
 S.cpr.push({y:calYear(),a:S.age,n:d.n,r:out,p:prize});if(S.cpr.length>80)S.cpr.shift();
 if(d.dj&&place!=null&&place<4)cpDebut(d,place);
 const m=`你參加「${d.n}」，結果：${out}${prize?`，獎金 ${money(prize)}`:''}。`;
 return place!=null&&place<3?G(m):place===3?N(m):B(m);
}

function otChapter(t,k){
 const A=t.a,ch=t.ch||0;if(ch>=4)return null;if(otAff(t,k)<OTREQ[ch])return null;
 const key='ch'+(t.id||k)+'_'+ch;if(S.acts[key])return null;return {a:A,i:ch,key,d:OTSTORY[A][ch]};
}
function otStory(k){
 const t=otGet(k);if(!t)return B('對象已不在了。');const c=otChapter(t,k);if(!c)return N('目前沒有可進行的章節。');
 if(S.ap<1)return B('今年的行動點用完了。');
 const d=c.d,nm=t.n,fill=s=>s.replace(/\{N\}/g,nm);
 const order=[0,1,2].sort(()=>Math.random()-.5);
 const labels=order.map(i=>d[2+i][0]);
 ask(`第 ${c.i+1} 章「${d[0]}」\n${fill(d[1])}`,labels,pi=>{
  const oi=order[pi],op=d[2+oi];S.acts[c.key]=1;S.ap--;
  let dl=oi===0?R(10,16):oi===1?R(3,6):-R(3,8);if(k==='p')dl=Math.round(dl*.6);if(dl>0&&S.looks>75)dl++;
  otAdd(t,k,dl);t.ch=(t.ch||0)+1;if(oi===0)t.bc=(t.bc||0)+1;
  chg('happy',oi===0?4:oi===1?1:-2);
  cgAdd({a:t.a,k:c.i,q:oi,n:nm,y:calYear()});
  let m=`你選了「${op[0]}」。\n${fill(op[1])}（好感 ${dl>=0?'+':''}${dl}）`;
  if(t.ch>=4){
   if((t.bc||0)>=3){t.route='真';m+=`\n\n你們走完了所有章節，心意早已相通——這是屬於你們的「真結局」路線。`}
   else m+=`\n\n你們走完了所有章節。結局如何，取決於之後的相處。`;
  }
  log(`與${nm}的專屬章節「${d[0]}」：好感 ${dl>=0?'+':''}${dl}。`,otTone(dl));
  view.rmsg={q:dl<0?'b':oi===0?'g':'n',t:m};otDone(k);
 });
 return null;
}

function otAct(id,k){
 const t=otGet(k);if(!t)return B('對象已不在了。');const o=OTA.find(x=>x.id===id);if(!o)return null;
 const A=ARCH[t.a];
 if(o.ap&&S.ap<1)return B('今年的行動點用完了。');
 if(o.cost&&S.money<o.cost)return B('你的錢不夠。');
 if(o.min&&otAff(t,k)<o.min)return B(`好感還不夠（需要 ${o.min}）。`);
 if(o.max&&otAff(t,k)>=o.max)return N('目前感情穩定，不需要特別和解。');
 if(o.pOnly&&otDist(t,k))return N('你們還沒有住在一起，目前是遠距離，見家長要等見面之後。');
 const r=o.run(t,k,A);if(otDist(t,k)){r[0]=r[0].replace('你們一起看了電影，散場後聊了很久。','你們各自在家同步看了電影，邊看邊傳訊息聊。').replace('你們一起念書','你們視訊一起念書').replace('你們一起運動','你們視訊連線一起運動').replace('驚喜成功了！','遠距驚喜（外送或快遞）成功了！').replace('時機不太對，驚喜變成了小小的尷尬。','快遞延誤了，驚喜晚了好幾天才到。')}
 if(r&&(r[1]==='good'||/好感 -/.test(r[0]))){if(o.ap)S.ap--;if(o.cost)S.money-=o.cost}
 return r;
}

 else if(t==='quit'&&S.job&&!S.job.founder){log(`你辭去了${S.job.t}。`);r=N('你辭職了。');S.job=null}
 else if(t==='dropout'){log(`你從${S.school}輟學了。`,'bad');S.school=null;S.tuition=0;chg('happy',-3);r=B('你輟學了。')}
 else if(t==='do'){r=interact(x,y)}
 else if(t==='buyH')r=buyHouse(+x,y);else if(t==='sellH')r=sellHouse();
 else if(t==='buyC')r=buyCar(+x);else if(t==='sellC')r=sellCar();
 view.msg=r;render();
 showSheet(view.tab,t==='do'&&!getP(x)?null:sub);
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showSheet(b.dataset.t));
$('ageBtn').onclick=ageUp;
$('sheetBody').onclick=e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)handle(b.dataset.a)};
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').classList.remove('on')};
