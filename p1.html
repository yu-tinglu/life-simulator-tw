<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人生模擬器</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e5e7eb;--acc:#0f766e;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:700;font-size:18px}.sub{font-size:13px;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:8px 14px 10px;background:var(--card)}
.st{font-size:12px}.st .lb{display:flex;justify-content:space-between}
.bar{height:8px;background:#eceff3;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:4px}
#feed{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.yr{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.yr h4{margin:0 0 4px;font-size:14px;color:var(--acc)}
.ln{font-size:15px;line-height:1.5;margin:4px 0;padding-left:8px;border-left:3px solid transparent}
.ln.good{border-color:var(--good)}.ln.bad{border-color:var(--bad)}
.bottom{display:flex;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.tab{flex:1;border:0;background:none;font-size:12px;padding:8px 0;min-height:58px;color:var(--ink)}
.tab b{display:block;font-size:20px;font-weight:400}
#ageBtn{flex:0 0 auto;width:80px;height:80px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:700;margin:-26px 6px 0;box-shadow:0 4px 12px rgba(0,0,0,.28)}
#ageBtn:disabled{opacity:.5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.on{display:flex}.ov.mid{align-items:center}
.pane{background:var(--card);width:100%;max-width:520px;max-height:84dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
.pane.mid{border-radius:16px;margin:14px;width:auto;max-width:480px}
.pane h3{margin:0 0 6px;font-size:18px}
.pane p{margin:6px 0;line-height:1.55;font-size:15px}
.btn{display:block;width:100%;padding:15px 14px;min-height:54px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;margin:9px 0;text-align:left;color:var(--ink)}
.btn.p{background:var(--acc);color:#fff;border:0;text-align:center;font-weight:700}
.btn:disabled{opacity:.45}
.btn small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.btn.p small{color:#d1fae5}
.mini{border:1px solid var(--acc);color:var(--acc);background:#fff;border-radius:10px;padding:11px 14px;min-height:44px;font-size:14px;margin-left:6px}
.sh{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;gap:8px;margin:-14px -14px 8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sh b{flex:1;font-size:17px}
.sh button{border:0;background:#f1f5f9;border-radius:50%;width:44px;height:44px;font-size:20px;color:var(--ink)}
.sh+h3{display:none}
.sh~.sec:first-of-type{margin-top:6px}
.sh+*{margin-top:12px}
.sh .bk{visibility:hidden}.sh .bk.on{visibility:visible}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.tile{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px 8px;font-size:15px;text-align:center;min-height:98px;color:var(--ink)}
.tile b{display:block;font-size:30px;font-weight:400;margin-bottom:6px}
.tile small{display:block;color:var(--mute);font-size:11px;margin-top:3px}
.sec{font-size:13px;color:var(--mute);margin:14px 0 4px;font-weight:700}
.msg{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:9px 11px;margin:6px 0 8px;font-size:14px;line-height:1.5}
.msg.bad{background:#fef2f2;border-color:#fecaca}
.item{padding:8px 0;border-bottom:1px solid var(--line)}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);font-size:16px;margin:6px 0}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:13px 6px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.neg{color:var(--bad)}
.seg button:disabled{opacity:.4}
table.rt{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 10px}
table.rt td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.rt td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.rt tr.b td{font-weight:700;background:#f8fafc}
table.rt tr.h td{font-weight:700;color:var(--acc);background:#ecfdf5;text-align:left}
#modal .pane{max-height:88dvh}
.bub{background:#fdf2f8;border-left:4px solid #ec4899;padding:10px 12px;border-radius:12px;margin:10px 0;line-height:1.7;font-size:15px}.bub.good{background:#ecfdf5;border-color:#10b981}.bub.bad{background:#fef2f2;border-color:#ef4444}
html.dark{--bg:#0f141b;--card:#1a212b;--ink:#e6e9ef;--mute:#98a2b3;--line:#2b3441;--acc:#2dd4bf;--good:#4ade80;--bad:#f87171}
html.dark .btn,html.dark .tile,html.dark .mini,html.dark .seg button{background:var(--card);color:var(--ink)}
html.dark .mini{color:var(--acc)}html.dark .btn.p,html.dark .seg button.on,html.dark #ageBtn{color:#06231f}
html.dark .seg button.on{background:var(--acc);color:#06231f;border-color:var(--acc)}html.dark .btn.p{background:var(--acc);color:#06231f}
html.dark .sh button{background:#2b3441}html.dark .bar{background:#2b3441}
html.dark .msg{background:#12301f;border-color:#1e5a37}html.dark .msg.bad{background:#3a1717;border-color:#7a2a2a}
html.dark .bub{background:#2a1a28}html.dark .bub.good{background:#12301f}html.dark .bub.bad{background:#3a1717}
html.dark table.rt tr.b td{background:#222a35}html.dark table.rt tr.h td{background:#12301f}
html.dark input,html.dark textarea{background:var(--card);color:var(--ink);border-color:var(--line)}
</style>
<style id="v2">
